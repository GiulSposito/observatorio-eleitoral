# Parâmetros do método (docs/05-metodo-analitico.md §6). Valores "simulacao" são substituídos
# pelo resultado da calibração (§5.6) e gravados em metodo.json da release.
method_version: "metodo-1.0.0"
populacao:
  tau_minimo_eleitores: 2          # tau = max(tau_minimo_eleitores, tau_fracao * E1)
  tau_fracao: 0.01
cobertura_minima: 0.90             # aptos do 1º turno nas unidades usadas / aptos do município
estimacao:
  n_secoes_min: 15                 # simulacao
  rhat_max: 1.01
  ess_min: 400
  cadeias: 4
  largura_determinada:
    votos_minimo: 5                # largura <= max(votos_minimo, fracao_linha * total da linha)
    fracao_linha: 0.01
  r_estimado: 0.25                 # simulacao
  r_fraco: 0.50                    # simulacao
  k_folds: 5
  ganho_preditivo_min: 0.90        # simulacao: erro_modelo <= ganho * erro_nulo
  massa_identificada_min: 0.80
  intervalo_nivel: 0.95
calibracao:
  cobertura_alvo: 0.90
  processos: [G1, G2, G3, G4]
  # execução da calibração (05 §5.6)
  estratos: [15, 30, 60, 150, 500]  # limites inferiores dos estratos por número de unidades
  municipios_por_estrato: 3
  max_unidades: 2000               # municípios maiores ficam fora da calibração (custo); ver benchmark
  grade_r: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.40, 0.50, 0.60, 0.75, 1.00]
  cobertura_fraca: 0.75            # critério do r_fraco (o 05 só diz "simulação")
  min_celulas: 30                  # células mínimas para aceitar um limiar
# Parâmetros de execução (não são limiares do 05 §6). Fixados pelo benchmark (tests/benchmark/RESULTS.md).
execucao:
  orcamento_segundos_por_municipio: 14400  # custo previsto acima disso -> md-bayes "failed" com motivo
  eipack:
    lambda1: 4                     # prior gama dos alphas (padrão do eiPack; ver benchmark)
    lambda2: 2
    burnin: 10000
    amostras: 1000
    thin: 10
    tune: true                     # eiPack::tuneMD antes de amostrar
    ntunes: 5
    tune_draws: 2000
    fundir_populacao_abaixo_de: 0.01   # N e S com menos de 1% do total são fundidas com X para o ajuste
  usar_ecolrxc: false              # ecolRxC só se couber no orçamento (ver benchmark)
  ecolrxc_max_unidades: 60
